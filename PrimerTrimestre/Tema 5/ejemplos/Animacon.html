<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animcaion</title>
    <style>
        p {
            position: relative;
            /* Adapta la anchura del contenedor al contenido */
            width: fit-content; 
            animation-name: slidein;
            animation-duration: 3s;
            /* Mantiene el estilo cuando acaba la animación */
            animation-fill-mode: forwards;
            
        }

        @keyframes slidein {
            0% {
                color: black;
                left: 100%;
            }

            33% {
                left: 50%;
                transform:
                    rotate(0deg);
            }

            66% {
                left: 50%;
                transform: rotate(360deg);
            }

            100% {
                color: red;
                left: 0%;
                transform:
                    rotate(360deg);
            }

        }
    </style>
</head>

<body>
    <p>Texto a animar</p>
</body>

</html>
