<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG vs IMG</title>
</head>

<body>
    <figure>
        <img src="img/descarga.png" alt="imagen en png">
        <p>Imagen JPG</p>
    </figure>
    <object data="img/svg.svg" type="image/svg+xml"></object>
    <p>Imagen SVG</p>
</body>

</html>
