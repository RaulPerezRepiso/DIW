<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtros</title>
    <link rel="stylesheet" href="style/style.css">
</head>

<body>
    <div class="tabla">
        <div class="fila">
            <div class="celda">
                <img src="img/paisaje.jpg" alt="original">
                <p style="text-align: center;"><strong>Original</strong></p>
            </div>
            <div class="celda">
                <img src="img/paisaje.jpg" alt="desenfoque" style="filter: blur(5px);">
                <p style="text-align: center;"><strong>Desenfoque</strong></p>
            </div>
            <div class="celda">
                <img src="img/paisaje.jpg" alt="brillo" style="filter: brightness(2);">
                <p style="text-align: center;"><strong>Brillo</strong></p>
            </div>
        </div>
        <div class="fila">
            <div class="celda">
                <img src="img/paisaje.jpg" alt="contraste" style="filter: contrast(2);">
                <p style="text-align: center;"><strong>Contraste</strong></p>
            </div>
            <div class="celda">
                <img src="img/paisaje.jpg" alt="efectos sombra" style="filter: drop-shadow(8px 8px 10px red);">
                <p style="text-align: center;"><strong>Efectos Sombra</strong></p>
            </div>
            <div class="celda">
                <img src="img/paisaje.jpg" alt="escala de grises" style="filter: grayscale(1);">
                <p style="text-align: center;"><strong>Escala de Grises</strong></p>
            </div>
        </div>
        <div class="fila">
            <div class="celda">
                <img src="img/paisaje.jpg" alt="rotacion tonos" style="filter: hue-rotate(180deg);">
                <p style="text-align: center;"><strong>Rotación tonos</strong></p>
            </div>
            <div class="celda">
                <img src="img/paisaje.jpg" alt="invertir colores" style="filter: invert(1);">
                <p style="text-align: center;"><strong>Invertir Colores</strong></p>
            </div>
            <div class="celda">
                <img src="img/paisaje.jpg" alt="opacidad" style="opacity: 65%;">
                <p style="text-align: center;"><strong>Opacidad</strong></p>
            </div>
        </div>
        <div class="fila">
            <div class="celda">
                <img src="img/paisaje.jpg" alt="saturacion" style="filter: saturate(100);">
                <p style="text-align: center;"><strong>Saturación</strong></p>
            </div>
            <div class="celda">
                <img src="img/paisaje.jpg" alt="sepia" style="filter: sepia(0.7);">
                <p style="text-align: center;"><strong>Sepia</strong></p>
            </div>
            <div class="celda">
                <img src="img/paisaje.jpg" alt="multiples estilos"  style="filter: invert(1) saturate(4); opacity: 65%;">
                <p style="text-align: center;"><strong>Multiples Estilos</strong></p>
            </div>
        </div>
    </div>
</body>

</html>
