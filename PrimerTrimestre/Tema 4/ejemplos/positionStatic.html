<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Static</title>
    <style>
        div {
            margin-bottom: 20px;
            padding: 20px;
            width: 200px;
            border-radius: 5px;
            background-color: bisque;
        }

        .div-secun {
            position: static; /*La posición static impide que se mueva nada*/
            top: 10px;
            left: 10px;
            background-color: red;
        }
    </style>
</head>

<body>
    <div class="div-ppal">Div Principal</div>
    <div class="div-secun">Div Secundario</div>

</body>

</html>
